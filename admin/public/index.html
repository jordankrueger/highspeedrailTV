<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin | HighSpeedRail.tv</title>
  <link rel="stylesheet" href="/admin.css">
</head>
<body>
  <div id="app">
    <!-- Login Screen -->
    <div id="login-screen" class="login-container">
      <div class="login-box">
        <h1>🚄 HighSpeedRail.tv</h1>
        <h2>Admin Panel</h2>
        <form id="login-form">
          <input type="password" id="password" placeholder="Enter admin password" required>
          <button type="submit">Sign In</button>
        </form>
        <p id="login-error" class="error"></p>
      </div>
    </div>

    <!-- Main Admin Panel -->
    <div id="admin-panel" class="hidden">
      <header class="admin-header">
        <div class="header-left">
          <h1>🚄 HighSpeedRail.tv Admin</h1>
        </div>
        <nav class="header-nav">
          <button class="nav-btn active" data-tab="search">Search</button>
          <button class="nav-btn" data-tab="queue">Queue <span id="queue-count" class="badge">0</span></button>
          <button class="nav-btn" data-tab="published">Published</button>
          <button class="nav-btn" data-tab="categories">Categories</button>
          <button class="nav-btn" data-tab="presets">Presets</button>
        </nav>
        <button id="logout-btn" class="logout-btn">Sign Out</button>
      </header>

      <main class="admin-main">
        <!-- Search Tab -->
        <section id="search-tab" class="tab-content active">
          <div class="search-header">
            <div class="search-box">
              <input type="text" id="search-input" placeholder="Search YouTube for high-speed rail content...">
              <button id="search-btn">Search</button>
            </div>
            <div class="preset-selector">
              <label>Quick Search:</label>
              <select id="preset-select">
                <option value="">Select a preset...</option>
              </select>
              <button id="run-preset-btn">Run</button>
            </div>
          </div>

          <div id="search-results" class="video-grid"></div>
          <div id="search-pagination" class="pagination"></div>
        </section>

        <!-- Queue Tab -->
        <section id="queue-tab" class="tab-content">
          <div class="tab-header">
            <h2>Review Queue</h2>
            <div class="view-toggle">
              <button class="view-btn active" data-view="grid">Grid</button>
              <button class="view-btn" data-view="detail">Detail</button>
            </div>
          </div>
          <div id="queue-content" class="video-grid"></div>
        </section>

        <!-- Published Tab -->
        <section id="published-tab" class="tab-content">
          <div class="tab-header">
            <h2>Published Videos</h2>
            <p class="subtitle" id="video-count">0 videos</p>
          </div>
          <div id="published-content" class="video-grid"></div>
        </section>

        <!-- Categories Tab -->
        <section id="categories-tab" class="tab-content">
          <div class="tab-header">
            <h2>Manage Categories</h2>
            <button id="add-category-btn" class="btn-primary">+ Add Category</button>
          </div>
          <div id="categories-content" class="categories-list"></div>
        </section>

        <!-- Presets Tab -->
        <section id="presets-tab" class="tab-content">
          <div class="tab-header">
            <h2>Search Presets</h2>
            <button id="add-preset-btn" class="btn-primary">+ Add Preset</button>
          </div>
          <div id="presets-content" class="presets-list"></div>
        </section>
      </main>
    </div>

    <!-- Video Detail Modal -->
    <div id="video-modal" class="modal hidden">
      <div class="modal-content">
        <button class="modal-close">&times;</button>
        <div class="modal-body">
          <div class="video-preview">
            <iframe id="modal-iframe" src="" allowfullscreen></iframe>
          </div>
          <div class="video-details">
            <h2 id="modal-title"></h2>
            <div class="video-meta">
              <span id="modal-channel"></span>
              <span id="modal-date"></span>
              <span id="modal-views"></span>
            </div>
            <p id="modal-description"></p>

            <form id="approve-form" class="approve-form">
              <h3>Add to Site</h3>
              <div class="form-group">
                <label for="modal-edit-title">Title</label>
                <input type="text" id="modal-edit-title" required>
              </div>
              <div class="form-group">
                <label for="modal-edit-description">Description</label>
                <textarea id="modal-edit-description" rows="3" required></textarea>
              </div>
              <div class="form-group">
                <label for="modal-category">Category</label>
                <select id="modal-category" required></select>
              </div>
              <div class="form-group checkbox">
                <label>
                  <input type="checkbox" id="modal-featured">
                  Feature on homepage
                </label>
              </div>
              <div class="form-actions">
                <button type="button" id="modal-reject-btn" class="btn-secondary">Remove from Queue</button>
                <button type="submit" class="btn-primary">Approve & Publish</button>
              </div>
            </form>
          </div>
        </div>
      </div>
    </div>

    <!-- Category Modal -->
    <div id="category-modal" class="modal hidden">
      <div class="modal-content small">
        <button class="modal-close">&times;</button>
        <h2 id="category-modal-title">Add Category</h2>
        <form id="category-form">
          <div class="form-group">
            <label for="category-name">Name</label>
            <input type="text" id="category-name" required>
          </div>
          <div class="form-group">
            <label for="category-description">Description</label>
            <textarea id="category-description" rows="2"></textarea>
          </div>
          <div class="form-actions">
            <button type="button" class="btn-secondary modal-cancel">Cancel</button>
            <button type="submit" class="btn-primary">Save</button>
          </div>
        </form>
      </div>
    </div>

    <!-- Preset Modal -->
    <div id="preset-modal" class="modal hidden">
      <div class="modal-content small">
        <button class="modal-close">&times;</button>
        <h2 id="preset-modal-title">Add Search Preset</h2>
        <form id="preset-form">
          <div class="form-group">
            <label for="preset-name">Name</label>
            <input type="text" id="preset-name" required>
          </div>
          <div class="form-group">
            <label for="preset-query">Search Query</label>
            <input type="text" id="preset-query" required>
            <small>Use OR for alternatives, quotes for exact phrases</small>
          </div>
          <div class="form-group">
            <label for="preset-max-results">Max Results</label>
            <input type="number" id="preset-max-results" value="10" min="1" max="50">
          </div>
          <div class="form-actions">
            <button type="button" class="btn-secondary modal-cancel">Cancel</button>
            <button type="submit" class="btn-primary">Save</button>
          </div>
        </form>
      </div>
    </div>

    <!-- Toast Notifications -->
    <div id="toast-container"></div>
  </div>

  <script src="/admin.js"></script>
</body>
</html>
